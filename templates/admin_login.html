{% extends "base.html" %}
{% block title %}Admin Login — MUDIT COMPUTERS{% endblock %}
{% block extra_styles %}
<style>
.login-page{
  min-height:calc(100vh - 56px);
  display:flex;align-items:center;justify-content:center;
  padding:24px 16px;
  background:linear-gradient(135deg,#050d1a 0%,#0f1e35 60%,#1d4ed8 100%);
}
.login-card{
  background:#fff;border-radius:20px;
  padding:44px 38px;max-width:420px;width:100%;
  box-shadow:0 24px 64px rgba(0,0,0,.35);
}
.login-logo{text-align:center;margin-bottom:30px}
.login-icon{
  width:68px;height:68px;background:var(--brand);border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;margin:0 auto 14px;
  box-shadow:0 8px 24px rgba(15,30,53,.3)
}
.login-logo h1{font-family:var(--fh);font-size:1.4rem;font-weight:800;color:var(--brand)}
.login-logo h1 span{color:#f59e0b}
.login-logo p{color:var(--muted);font-size:.85rem;margin-top:3px}
.login-btn{
  width:100%;padding:13px;justify-content:center;
  font-size:1rem;border-radius:10px;margin-top:4px;
  box-shadow:0 4px 16px rgba(29,78,216,.3)
}
.warn-box{
  display:flex;align-items:center;gap:8px;
  background:#fffbeb;border:1px solid #fcd34d;
  border-radius:8px;padding:10px 14px;
  font-size:.8rem;color:#92400e;margin-top:18px
}
.divider-or{
  display:flex;align-items:center;gap:12px;
  color:var(--muted);font-size:.8rem;margin:18px 0;
}
.divider-or::before,.divider-or::after{content:'';flex:1;height:1px;background:var(--border)}
</style>
{% endblock %}

{% block content %}
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-icon">🖥️</div>
      <h1>MUDIT <span>COMPUTERS</span></h1>
      <p>Admin Panel — Staff Only</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input class="form-control" type="email" id="email"
               placeholder="admin@muditcomputers.com" required autofocus autocomplete="email"
               style="font-size:1rem;padding:11px 14px">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-control" type="password" id="password"
               placeholder="••••••••" required autocomplete="current-password"
               style="font-size:1rem;padding:11px 14px">
      </div>
      <button type="submit" class="btn btn-primary login-btn" id="login-btn">
        🔐 Sign In
      </button>
    </form>

    <div class="warn-box">
      ⚠️ Restricted to shop staff only. Unauthorized access prohibited.
    </div>
  </div>
</div>

<script type="module">
import { signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';

const loginForm = document.getElementById('login-form');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const loginBtn = document.getElementById('login-btn');

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginBtn.disabled = true;
  loginBtn.textContent = 'Signing In...';

  try {
    const userCredential = await signInWithEmailAndPassword(window.firebase.auth, emailInput.value, passwordInput.value);
    const user = userCredential.user;
    const idToken = await user.getIdToken();

    // Send token to server for session
    const response = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idToken })
    });

    if (response.ok) {
      window.location.href = '/admin/dashboard';
    } else {
      throw new Error('Server login failed');
    }
  } catch (error) {
    alert('Login failed: ' + error.message);
    loginBtn.disabled = false;
    loginBtn.textContent = '🔐 Sign In';
  }
});
</script>
{% endblock %}
