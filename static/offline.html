<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Warranty App</title>
  <style>
    body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#f1f5f9;color:#0f1e35;display:flex;align-items:center;justify-content:center;min-height:100vh;}
    .box{max-width:420px;padding:28px;background:#fff;border-radius:18px;box-shadow:0 12px 40px rgba(15,30,53,.12);text-align:center;}
    h1{margin-bottom:14px;font-size:1.8rem;}
    p{margin-bottom:22px;color:#475569;line-height:1.7;}
    a{display:inline-block;padding:10px 18px;border-radius:10px;background:#1d4ed8;color:#fff;text-decoration:none;font-weight:700;}
  </style>
</head>
<body>
  <div class="box">
    <h1>आप ऑफ़लाइन हैं</h1>
    <p>यह पेज इंटरनेट कनेक्शन नहीं मिलने पर भी काम करने की कोशिश करेगा। फिर भी रूट पेज पर वापस जाएँ या कनेक्शन जाँचें।</p>
    <a href="/">होम पर जाएँ</a>
  </div>
</body>
</html>
